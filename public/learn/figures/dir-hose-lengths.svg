<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="Typical DIR hose lengths drawn to scale, from the 7-foot long hose to the 6-inch high-pressure hose on a deco or stage regulator."><rect width="960" height="600" fill="#fffef9"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#141414"/></marker></defs><text x="40" y="46" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#5f5d55" text-anchor="start">HOSE LENGTHS TO SCALE</text><text x="40" y="68" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#5f5d55" text-anchor="start">Solid bar: typical length. Light extension: common range.</text><line x1="300.0" y1="86" x2="300.0" y2="526" stroke="#dad8ce" stroke-width="1"/><text x="300.0" y="546" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#5f5d55" text-anchor="middle">0 in</text><line x1="374.4" y1="86" x2="374.4" y2="526" stroke="#dad8ce" stroke-width="1"/><text x="374.4" y="546" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#5f5d55" text-anchor="middle">12 in</text><line x1="448.8" y1="86" x2="448.8" y2="526" stroke="#dad8ce" stroke-width="1"/><text x="448.8" y="546" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#5f5d55" text-anchor="middle">24 in</text><line x1="523.2" y1="86" x2="523.2" y2="526" stroke="#dad8ce" stroke-width="1"/><text x="523.2" y="546" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#5f5d55" text-anchor="middle">36 in</text><line x1="597.6" y1="86" x2="597.6" y2="526" stroke="#dad8ce" stroke-width="1"/><text x="597.6" y="546" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#5f5d55" text-anchor="middle">48 in</text><line x1="672.0" y1="86" x2="672.0" y2="526" stroke="#dad8ce" stroke-width="1"/><text x="672.0" y="546" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#5f5d55" text-anchor="middle">60 in</text><line x1="746.4000000000001" y1="86" x2="746.4000000000001" y2="526" stroke="#dad8ce" stroke-width="1"/><text x="746.4000000000001" y="546" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#5f5d55" text-anchor="middle">72 in</text><line x1="820.8000000000001" y1="86" x2="820.8000000000001" y2="526" stroke="#dad8ce" stroke-width="1"/><text x="820.8000000000001" y="546" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#5f5d55" text-anchor="middle">84 in</text><text x="286" y="112" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#141414" text-anchor="end">Long hose (primary)</text><rect x="300" y="95" width="520.8000000000001" height="18" rx="9" fill="#E5B812"/><text x="312" y="134" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#5f5d55" text-anchor="start">7 ft (84 in). UTD allows 5 or 7 ft</text><text x="286" y="168" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#141414" text-anchor="end">Deco or stage regulator</text><rect x="300" y="151" width="248.0" height="18" rx="9" fill="#141414"/><text x="560.0" y="166" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#5f5d55" text-anchor="start">40 in LP hose</text><text x="286" y="224" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#141414" text-anchor="end">Necklace backup</text><rect x="300" y="207" width="148.8" height="18" rx="9" fill="#141414" opacity="0.25"/><rect x="300" y="207" width="136.4" height="18" rx="9" fill="#141414"/><text x="460.8" y="222" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#5f5d55" text-anchor="start">22–24 in</text><text x="286" y="280" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#141414" text-anchor="end">Pressure gauge, singles</text><rect x="300" y="263" width="161.20000000000002" height="18" rx="9" fill="#141414"/><text x="473.20000000000005" y="278" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#5f5d55" text-anchor="start">About 26 in</text><text x="286" y="336" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#141414" text-anchor="end">Pressure gauge, doubles</text><rect x="300" y="319" width="161.20000000000002" height="18" rx="9" fill="#141414" opacity="0.25"/><rect x="300" y="319" width="148.8" height="18" rx="9" fill="#141414"/><text x="473.20000000000005" y="334" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#5f5d55" text-anchor="start">About 24–26 in</text><text x="286" y="392" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#141414" text-anchor="end">Wing inflator</text><rect x="300" y="375" width="148.8" height="18" rx="9" fill="#141414" opacity="0.25"/><rect x="300" y="375" width="124.0" height="18" rx="9" fill="#141414"/><text x="460.8" y="390" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#5f5d55" text-anchor="start">About 20–24 in</text><text x="286" y="448" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#141414" text-anchor="end">Drysuit inflator</text><rect x="300" y="431" width="223.20000000000002" height="18" rx="9" fill="#141414" opacity="0.25"/><rect x="300" y="431" width="111.60000000000001" height="18" rx="9" fill="#141414"/><text x="535.2" y="446" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#5f5d55" text-anchor="start">Varies with rig and valve</text><text x="286" y="504" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#141414" text-anchor="end">Deco or stage gauge</text><rect x="300" y="487" width="37.2" height="18" rx="9" fill="#141414"/><text x="349.2" y="502" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#5f5d55" text-anchor="start">6 in HP hose</text></svg>