<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="Front view of the long hose routing: down the right side, tucked at the right hip, across the chest, around the neck and into the mouth from the right, with the necklace backup under the chin and the gauge at the left hip."><rect width="960" height="600" fill="#fffef9"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#141414"/></marker></defs><text x="40" y="46" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#5f5d55" text-anchor="start">SEEN FROM THE FRONT</text><text x="40" y="68" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#5f5d55" text-anchor="start">Diver's right is on the left</text><circle cx="480" cy="96" r="46" fill="#eeede6" stroke="#141414" stroke-width="2.5"/><path d="M440,150 L330,186 Q304,196 302,226 L310,520 L650,520 L658,226 Q656,196 630,186 L520,150 Z" fill="#eeede6" stroke="#141414" stroke-width="2.5"/><path d="M370,178 L360,470 M590,178 L600,470" stroke="#5f5d55" stroke-width="10" stroke-linecap="round" opacity="0.45"/><rect x="310" y="456" width="340" height="18" fill="#5f5d55" opacity="0.45"/><path d="M520,154 C500,136 450,136 434,150" fill="none" stroke="#E5B812" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><rect x="456" y="126" width="48" height="30" fill="#eeede6"/><path d="M456,132 L456,151 M504,132 L504,151" stroke="#141414" stroke-width="2.5"/><circle cx="480" cy="96" r="46" fill="#eeede6" stroke="#141414" stroke-width="2.5"/><rect x="284" y="430" width="44" height="74" rx="8" fill="#b9b7ad" stroke="#141414" stroke-width="2"/><path d="M330,190 C312,260 310,360 306,440 C304,500 360,500 420,430 L550,250 C576,212 560,170 520,154" fill="none" stroke="#E5B812" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M434,150 C420,140 426,124 456,120" fill="none" stroke="#E5B812" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><rect x="454" y="110" width="30" height="20" rx="5" fill="#141414"/><path d="M440,150 Q480,176 520,150" fill="none" stroke="#141414" stroke-width="2" stroke-dasharray="4 4"/><rect x="462" y="160" width="36" height="22" rx="6" fill="#141414"/><path d="M630,190 C650,300 648,380 640,448" fill="none" stroke="#141414" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="640" cy="466" r="16" fill="#fffef9" stroke="#141414" stroke-width="3"/><path d="M600,170 C616,220 612,260 598,300" fill="none" stroke="#141414" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><rect x="586" y="296" width="26" height="30" rx="6" fill="#141414"/><circle cx="494" cy="292" r="12" fill="#b9b7ad" stroke="#141414" stroke-width="2"/><text x="40" y="250" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#141414" text-anchor="start">Long hose</text><text x="40" y="272" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#141414" text-anchor="start">Down the right side,</text><text x="40" y="294" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#141414" text-anchor="start">tucked at the right hip,</text><text x="40" y="316" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#141414" text-anchor="start">across the chest and</text><text x="40" y="338" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#141414" text-anchor="start">around the neck</text><line x1="214" y1="300" x2="312" y2="330" stroke="#5f5d55" stroke-width="1.5"/><circle cx="312" cy="330" r="3.5" fill="#5f5d55"/><text x="40" y="470" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#141414" text-anchor="start">Hip tuck</text><text x="40" y="492" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#141414" text-anchor="start">Light canister or</text><text x="40" y="514" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#141414" text-anchor="start">waist belt</text><line x1="140" y1="476" x2="284" y2="468" stroke="#5f5d55" stroke-width="1.5"/><circle cx="284" cy="468" r="3.5" fill="#5f5d55"/><text x="700" y="110" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#141414" text-anchor="start">Necklace backup</text><text x="700" y="132" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#141414" text-anchor="start">Under the chin. Take it</text><text x="700" y="154" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#141414" text-anchor="start">with your left hand</text><text x="700" y="176" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#141414" text-anchor="start">after donating</text><line x1="696" y1="118" x2="498" y2="170" stroke="#5f5d55" stroke-width="1.5"/><circle cx="498" cy="170" r="3.5" fill="#5f5d55"/><text x="700" y="236" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#141414" text-anchor="start">Wing inflator</text><text x="700" y="258" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#141414" text-anchor="start">Left shoulder</text><line x1="696" y1="242" x2="612" y2="250" stroke="#5f5d55" stroke-width="1.5"/><circle cx="612" cy="250" r="3.5" fill="#5f5d55"/><text x="700" y="330" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#141414" text-anchor="start">Drysuit valve</text><text x="700" y="352" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#141414" text-anchor="start">Center chest</text><line x1="696" y1="336" x2="506" y2="292" stroke="#5f5d55" stroke-width="1.5"/><circle cx="506" cy="292" r="3.5" fill="#5f5d55"/><text x="700" y="440" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#141414" text-anchor="start">Pressure gauge</text><text x="700" y="462" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#141414" text-anchor="start">Clipped at the</text><text x="700" y="484" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#141414" text-anchor="start">left hip D-ring</text><line x1="696" y1="446" x2="656" y2="466" stroke="#5f5d55" stroke-width="1.5"/><circle cx="656" cy="466" r="3.5" fill="#5f5d55"/><text x="480" y="572" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#5f5d55" text-anchor="middle">The primary comes into your mouth from the right, so it presents straight to a teammate.</text></svg>