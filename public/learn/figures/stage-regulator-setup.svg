<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="A stage or deco regulator: a 40-inch low-pressure hose runs down the bottle and back up under inner-tube bands to the stowed second stage, and a compact gauge on a 6-inch high-pressure hose is doubled back and held by a bungee loop."><rect width="960" height="600" fill="#fffef9"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#141414"/></marker></defs><text x="40" y="46" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#5f5d55" text-anchor="start">STAGE OR DECO REGULATOR</text><text x="40" y="68" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#5f5d55" text-anchor="start">Short and simple: one second stage, one compact gauge</text><path d="M410,240.0 A70.0,70.0 0 0 1 550,240.0 L550,558 Q550,570 538,570 L422,570 Q410,570 410,558 Z" fill="#eeede6" stroke="#141414" stroke-width="2.5"/><rect x="466" y="124" width="28" height="50" fill="#b9b7ad" stroke="#141414" stroke-width="2"/><rect x="446" y="112" width="68" height="16" rx="6" fill="#141414"/><rect x="492" y="120" width="60" height="34" rx="10" fill="#b9b7ad" stroke="#141414" stroke-width="2"/><path d="M552,140 C590,150 572,220 540,300 L530,470 C526,500 500,510 480,500 L470,326" fill="none" stroke="#141414" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="452" y="290" width="40" height="36" rx="8" fill="#141414"/><rect x="410" y="300" width="140" height="14" fill="#141414" opacity="0.55"/><rect x="410" y="450" width="140" height="14" fill="#141414" opacity="0.55"/><path d="M510,154 C506,190 476,206 460,196" fill="none" stroke="#141414" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="446" cy="196" r="15" fill="#fffef9" stroke="#141414" stroke-width="3"/><path d="M430,196 C420,170 450,160 470,164" fill="none" stroke="#7a6100" stroke-width="2.5"/><text x="40" y="200" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#141414" text-anchor="start">Compact gauge</text><text x="40" y="222" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#141414" text-anchor="start">On a 6 in HP hose,</text><text x="40" y="244" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#141414" text-anchor="start">doubled back and held</text><text x="40" y="266" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#141414" text-anchor="start">by a 4 mm bungee loop</text><line x1="228" y1="206" x2="430" y2="198" stroke="#5f5d55" stroke-width="1.5"/><circle cx="430" cy="198" r="3.5" fill="#5f5d55"/><text x="660" y="220" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#141414" text-anchor="start">40 in LP hose</text><text x="660" y="242" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#141414" text-anchor="start">Runs down the bottle</text><text x="660" y="264" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#141414" text-anchor="start">and back up under</text><text x="660" y="286" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#141414" text-anchor="start">the bands</text><line x1="656" y1="226" x2="572" y2="230" stroke="#5f5d55" stroke-width="1.5"/><circle cx="572" cy="230" r="3.5" fill="#5f5d55"/><text x="660" y="380" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#141414" text-anchor="start">Second stage</text><text x="660" y="402" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#141414" text-anchor="start">Tucked under the top</text><text x="660" y="424" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#141414" text-anchor="start">band, ready to deploy</text><line x1="656" y1="386" x2="492" y2="318" stroke="#5f5d55" stroke-width="1.5"/><circle cx="492" cy="318" r="3.5" fill="#5f5d55"/><text x="40" y="470" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#141414" text-anchor="start">Inner tube bands</text><text x="40" y="492" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#141414" text-anchor="start">Hold the hose flat</text><text x="40" y="514" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#141414" text-anchor="start">against the bottle</text><line x1="220" y1="476" x2="410" y2="456" stroke="#5f5d55" stroke-width="1.5"/><circle cx="410" cy="456" r="3.5" fill="#5f5d55"/></svg>