<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="Three bottles: a nitrox 50 deco bottle marked 70 FT, an oxygen bottle marked 20 FT and OXYGEN, and a stage bottle with no depth marking. Each carries an analysis label near the neck and initials near the bottom."><rect width="960" height="600" fill="#fffef9"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#141414"/></marker></defs><text x="40" y="46" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#5f5d55" text-anchor="start">MARKING DECO AND STAGE BOTTLES</text><text x="40" y="68" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#5f5d55" text-anchor="start">MOD in letters about 3 inches high, readable by you and your teammate</text><path d="M118,202.0 A62.0,62.0 0 0 1 242,202.0 L242,508 Q242,520 230,520 L130,520 Q118,520 118,508 Z" fill="#eeede6" stroke="#141414" stroke-width="2.5"/><rect x="168" y="100" width="24" height="44" fill="#b9b7ad" stroke="#141414" stroke-width="2"/><rect x="150" y="90" width="60" height="14" rx="5" fill="#141414"/><rect x="134" y="168" width="92" height="40" rx="4" fill="#fffef9" stroke="#141414" stroke-width="1.5"/><text x="180" y="185" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#141414" text-anchor="middle">ANALYSIS</text><text x="180" y="200" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="10" font-weight="400" fill="#5f5d55" text-anchor="middle">gas · date · init.</text><rect x="126" y="372" width="108" height="56" fill="#E5B812"/><text x="180" y="412" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#141414" text-anchor="middle">70 FT</text><rect x="158" y="476" width="44" height="22" rx="3" fill="#fffef9" stroke="#141414" strok