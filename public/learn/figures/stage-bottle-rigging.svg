<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="A rigged aluminum stage bottle: a line runs from the neck to a covered hose clamp, with a bolt snap at the top for the chest D-ring and one at the clamp for the hip D-ring, and inner-tube bands holding the regulator."><rect width="960" height="600" fill="#fffef9"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#141414"/></marker></defs><text x="40" y="46" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#5f5d55" text-anchor="start">STAGE OR DECO BOTTLE RIGGING</text><text x="40" y="68" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#5f5d55" text-anchor="start">Aluminum 80 or 40 only. Nothing metal on metal.</text><path d="M400,220.0 A70.0,70.0 0 0 1 540,220.0 L540,548 Q540,560 528,560 L412,560 Q400,560 400,548 Z" fill="#eeede6" stroke="#141414" stroke-width="2.5"/><rect x="456" y="104" width="28" height="50" fill="#b9b7ad" stroke="#141414" stroke-width="2"/><rect x="436" y="92" width="68" height="16" rx="6" fill="#141414"/><path d="M454,158 C400,176 382,200 378,240 L378,372" fill="none" stroke="#E5B812" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="370" y="372" width="16" height="44" rx="4" fill="#141414"/><rect x="400" y="384" width="140" height="12" fill="#b9b7ad" stroke="#141414" stroke-width="2"/><rect x="358" y="214" width="18" height="40" rx="7" fill="#b9b7ad" stroke="#141414" stroke-width="2"/><rect x="358" y="412" width="18" height="40" rx="7" fill="#b9b7ad" stroke="#141414" stroke-width="2"/><rect x="400" y="260" width="140" height="16" fill="#141414" opacity="0.8"/><rect x="400" y="470" width="140" height="16" fill="#141414" opacity="0.8"/><text x="40" y="170" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#141414" text-anchor="start">Top bolt snap</text><text x="40" y="192" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#141414" text-anchor="start">Clips to your left</text><text x="40" y="214" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#141414" text-anchor="start">chest D-ring</text><line x1="190" y1="176" x2="358" y2="228" stroke="#5f5d55" stroke-width="1.5"/><circle cx="358" cy="228" r="3.5" fill="#5f5d55"/><text x="40" y="270" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#141414" text-anchor="start">Line</text><text x="40" y="292" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#141414" text-anchor="start">About 6.5 ft of 5 mm</text><text x="40" y="314" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#141414" text-anchor="start">braided nylon, tied</text><text x="40" y="336" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#141414" text-anchor="start">around the neck</text><line x1="206" y1="276" x2="378" y2="300" stroke="#5f5d55" stroke-width="1.5"/><circle cx="378" cy="300" r="3.5" fill="#5f5d55"/><text x="40" y="384" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#141414" text-anchor="start">Fuel tubing</text><text x="40" y="406" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#141414" text-anchor="start">Protects the line</text><text x="40" y="428" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#141414" text-anchor="start">at the clamp</text><line x1="186" y1="390" x2="370" y2="386" stroke="#5f5d55" stroke-width="1.5"/><circle cx="370" cy="386" r="3.5" fill="#5f5d55"/><text x="40" y="490" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#141414" text-anchor="start">Bottom bolt snap</text><text x="40" y="512" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#141414" text-anchor="start">Clips to your left</text><text x="40" y="534" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#141414" text-anchor="start">hip D-ring</text><line x1="200" y1="496" x2="358" y2="444" stroke="#5f5d55" stroke-width="1.5"/><circle cx="358" cy="444" r="3.5" fill="#5f5d55"/><text x="620" y="260" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#141414" text-anchor="start">Inner tube bands</text><text x="620" y="282" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#141414" text-anchor="start">Hold the regulator hose</text><text x="620" y="304" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#141414" text-anchor="start">and second stage</text><line x1="616" y1="266" x2="540" y2="268" stroke="#5f5d55" stroke-width="1.5"/><circle cx="540" cy="268" r="3.5" fill="#5f5d55"/><text x="620" y="380" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#141414" text-anchor="start">Hose clamp</text><text x="620" y="402" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#141414" text-anchor="start">Covered stainless clamp.</text><text x="620" y="424" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#141414" text-anchor="start">Its position sets how</text><text x="620" y="446" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#141414" text-anchor="start">the bottle hangs</text><line x1="616" y1="386" x2="540" y2="390" stroke="#5f5d55" stroke-width="1.5"/><circle cx="540" cy="390" r="3.5" fill="#5f5d55"/></svg>