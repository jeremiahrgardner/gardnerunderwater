<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="Backmount doubles seen from behind: the right post feeds the long hose and the wing inflator; the left post feeds the necklace backup, the pressure gauge and the drysuit inflator."><rect width="960" height="600" fill="#fffef9"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#141414"/></marker></defs><text x="40" y="46" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#5f5d55" text-anchor="start">SEEN FROM BEHIND</text><text x="40" y="68" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#5f5d55" text-anchor="start">Diver's left is on the left</text><path d="M330,255.0 A65.0,65.0 0 0 1 460,255.0 L460,548 Q460,560 448,560 L342,560 Q330,560 330,548 Z" fill="#eeede6" stroke="#141414" stroke-width="2.5"/><path d="M500,255.0 A65.0,65.0 0 0 1 630,255.0 L630,548 Q630,560 618,560 L512,560 Q500,560 500,548 Z" fill="#eeede6" stroke="#141414" stroke-width="2.5"/><rect x="390" y="150" width="180" height="16" rx="6" fill="#b9b7ad" stroke="#141414" stroke-width="2"/><rect x="381" y="150" width="28" height="44" fill="#b9b7ad" stroke="#141414" stroke-width="2"/><rect x="369" y="128" width="52" height="16" rx="6" fill="#141414"/><rect x="551" y="150" width="28" height="44" fill="#b9b7ad" stroke="#141414" stroke-width="2"/><rect x="539" y="128" width="52" height="16" rx="6" fill="#141414"/><rect x="466" y="128" width="28" height="22" rx="5" fill="#141414"/><text x="480" y="120" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#5f5d55" text-anchor="middle">ISOLATOR</text><rect x="300" y="160" width="74" height="36" rx="10" fill="#b9b7ad" stroke="#141414" stroke-width="2"/><rect x="586" y="160" width="74" height="36" rx="10" fill="#b9b7ad" stroke="#141414" stroke-width="2"/><text x="395" y="222" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#141414" text-anchor="middle">LEFT POST</text><text x="565" y="222" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#141414" text-anchor="middle">RIGHT POST</text><path d="M660,184 C700,200 712,240 712,300 L712,560" fill="none" stroke="#E5B812" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M640,162 C630,96 540,84 470,84 C390,84 290,100 232,146" fill="none" stroke="#141414" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M232,146 C216,170 208,200 208,236" fill="none" stroke="#141414" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/><rect x="196" y="232" width="24" height="28" rx="6" fill="#141414"/><path d="M300,170 C276,146 262,112 258,84" fill="none" stroke="#141414" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M310,194 C280,230 262,280 262,330 L262,520" fill="none" stroke="#141414" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 0"/><path d="M318,196 C300,250 250,280 196,312" fill="none" stroke="#141414" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10 7"/><text x="736" y="330" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#141414" text-anchor="start">Long hose, 7 ft</text><text x="736" y="352" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#141414" text-anchor="start">Down your right side,</text><text x="736" y="374" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#141414" text-anchor="start">under the light canister</text><text x="736" y="396" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#141414" text-anchor="start">or waist belt</text><text x="700" y="100" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#141414" text-anchor="start">Wing inflator</text><text x="700" y="122" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#141414" text-anchor="start">Right post, behind your</text><text x="700" y="144" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#141414" text-anchor="start">head to the left shoulder</text><line x1="696" y1="106" x2="612" y2="116" stroke="#5f5d55" stroke-width="1.5"/><circle cx="612" cy="116" r="3.5" fill="#5f5d55"/><text x="40" y="104" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#141414" text-anchor="start">Necklace backup</text><text x="40" y="126" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#141414" text-anchor="start">Over the left shoulder</text><text x="40" y="148" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#141414" text-anchor="start">to the bungee necklace</text><line x1="200" y1="112" x2="256" y2="88" stroke="#5f5d55" stroke-width="1.5"/><circle cx="256" cy="88" r="3.5" fill="#5f5d55"/><text x="40" y="404" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#141414" text-anchor="start">Pressure gauge</text><text x="40" y="426" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#141414" text-anchor="start">Down the left side,</text><text x="40" y="448" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#141414" text-anchor="start">clipped at the left hip</text><line x1="204" y1="410" x2="262" y2="420" stroke="#5f5d55" stroke-width="1.5"/><circle cx="262" cy="420" r="3.5" fill="#5f5d55"/><text x="40" y="290" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#141414" text-anchor="start">Drysuit inflator</text><text x="40" y="312" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#141414" text-anchor="start">Under the left arm</text><text x="40" y="334" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#141414" text-anchor="start">to the suit valve</text><line x1="176" y1="300" x2="198" y2="310" stroke="#5f5d55" stroke-width="1.5"/><circle cx="198" cy="310" r="3.5" fill="#5f5d55"/><path d="M736,470 L782,470" fill="none" stroke="#E5B812" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="794" y="476" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#141414" text-anchor="start">Primary (donated)</text><path d="M736,498 L782,498" fill="none" stroke="#141414" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="794" y="504" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#141414" text-anchor="start">Low pressure hose</text><path d="M736,526 L782,526" fill="none" stroke="#141414" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10 7"/><text x="794" y="532" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#141414" text-anchor="start">Drysuit, if worn</text><path d="M736,554 L782,554" fill="none" stroke="#141414" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/><text x="794" y="560" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#141414" text-anchor="start">Wing corrugated hose</text></svg>