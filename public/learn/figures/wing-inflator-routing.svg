<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="Wing inflator routing seen from behind: on a single tank, the hose runs from a left-side port to the left shoulder; on backmount doubles, it runs from the right post, behind the head, to the left shoulder."><rect width="960" height="600" fill="#fffef9"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#141414"/></marker></defs><text x="40" y="46" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#5f5d55" text-anchor="start">WING INFLATOR HOSE, SEEN FROM BEHIND</text><text x="40" y="68" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#5f5d55" text-anchor="start">Diver's left is on the left</text><text x="240" y="112" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#141414" text-anchor="middle">Single tank</text><path d="M180,274.0 A60.0,60.0 0 0 1 300,274.0 L300,388 Q300,400 288,400 L192,400 Q180,400 180,388 Z" fill="#eeede6" stroke="#141414" stroke-width="2.5"/><rect x="228" y="168" width="24" height="48" fill="#b9b7ad" stroke="#141414" stroke-width="2"/><rect x="196" y="176" width="88" height="34" rx="10" fill="#b9b7ad" stroke="#141414" stroke-width="2"/><path d="M196,186 C160,180 136,160 124,140" fill="none" stroke="#E5B812" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M124,140 C110,180 108,220 112,252" fill="none" stroke="#141414" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/><text x="40" y="460" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#141414" text-anchor="start">From a left-side port</text><text x="40" y="482" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#141414" text-anchor="start">Straight up to the inflator</text><text x="40" y="504" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#141414" text-anchor="start">on your left shoulder</text><text x="680" y="112" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#141414" text-anchor="middle">Backmount doubles</text><path d="M560,269.0 A55.0,55.0 0 0 1 670,269.0 L670,388 Q670,400 658,400 L572,400 Q560,400 560,388 Z" fill="#eeede6" stroke="#141414" stroke-width="2.5"/><path d="M690,269.0 A55.0,55.0 0 0 1 800,269.0 L800,388 Q800,400 788,400 L702,400 Q690,400 690,388 Z" fill="#eeede6" stroke="#141414" stroke-width="2.5"/><rect x="600" y="168" width="160" height="14" rx="6" fill="#b9b7ad" stroke="#141414" stroke-width="2"/><rect x="603" y="168" width="24" height="48" fill="#b9b7ad" stroke="#141414" stroke-width="2"/><rect x="733" y="168" width="24" height="48" fill="#b9b7ad" stroke="#141414" stroke-width="2"/><rect x="770" y="176" width="62" height="32" rx="10" fill="#b9b7ad" stroke="#141414" stroke-width="2"/><rect x="528" y="176" width="62" height="32" rx="10" fill="#b9b7ad" stroke="#141414" stroke-width="2"/><path d="M800,176 C796,142 740,138 680,138 C610,138 540,140 500,160" fill="none" stroke="#E5B812" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M500,160 C484,190 480,226 484,256" fill="none" stroke="#141414" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/><text x="615" y="426" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#5f5d55" text-anchor="middle">Left post</text><text x="745" y="426" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#5f5d55" text-anchor="middle">Right post</text><text x="520" y="470" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#141414" text-anchor="start">From the right post</text><text x="520" y="492" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#141414" text-anchor="start">Behind your head to the inflator</text><text x="520" y="514" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#141414" text-anchor="start">on your left shoulder. Wing filling</text><text x="520" y="536" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#141414" text-anchor="start">by itself? Dump it, then shut</text><text x="520" y="558" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#141414" text-anchor="start">down the right post.</text><path d="M40,542 L86,542" fill="none" stroke="#E5B812" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="98" y="548" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#141414" text-anchor="start">Inflator low-pressure hose</text><path d="M40,570 L86,570" fill="none" stroke="#141414" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/><text x="98" y="576" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#141414" text-anchor="start">Wing corrugated hose</text></svg>