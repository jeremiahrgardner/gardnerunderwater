<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="A drysuit inflation bottle strapped to the left side of the backplate with its valve down, and a short hose running under the left arm to the drysuit valve."><rect width="960" height="600" fill="#fffef9"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#141414"/></marker></defs><text x="40" y="46" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#5f5d55" text-anchor="start">DRYSUIT INFLATION BOTTLE, SEEN FROM BEHIND</text><text x="40" y="68" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#5f5d55" text-anchor="start">Diver's left is on the left</text><rect x="360" y="150" width="240" height="380" rx="30" fill="#b9b7ad" opacity="0.35" stroke="#141414" stroke-width="2"/><path d="M372,220.0 A50.0,50.0 0 0 1 472,220.0 L472,548 Q472,560 460,560 L384,560 Q372,560 372,548 Z" fill="#eeede6" stroke="#141414" stroke-width="2.5"/><path d="M488,220.0 A50.0,50.0 0 0 1 588,220.0 L588,548 Q588,560 576,560 L500,560 Q488,560 488,548 Z" fill="#eeede6" stroke="#141414" stroke-width="2.5"/><path d="M282,300 L282,456 Q282,470 296,470 L330,470 Q344,470 344,456 L344,300 A31,31 0 0 0 282,300 Z" fill="#eeede6" stroke="#141414" stroke-width="2.5" transform="rotate(180 313 385)"/><rect x="303" y="456" width="20" height="26" fill="#b9b7ad" stroke="#141414" stroke-width="2"/><rect x="292" y="482" width="42" height="12" rx="5" fill="#141414"/><rect x="270" y="496" width="64" height="30" rx="9" fill="#b9b7ad" stroke="#141414" stroke-width="2"/><rect x="276" y="340" width="100" height="12" fill="#141414" opacity="0.7"/><rect x="276" y="420" width="100" height="12" fill="#141414" opacity="0.7"/><path d="M276,510 C230,500 200,440 200,380 C200,330 214,300 230,280" fill="none" stroke="#E5B812" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="40" y="200" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#141414" text-anchor="start">To the suit valve</text><text x="40" y="222" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#141414" text-anchor="start">Short hose under</text><text x="40" y="244" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#141414" text-anchor="start">the left arm</text><line x1="186" y1="210" x2="226" y2="284" stroke="#5f5d55" stroke-width="1.5"/><circle cx="226" cy="284" r="3.5" fill="#5f5d55"/><text x="640" y="250" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#141414" text-anchor="start">Small bottle, valve down</text><text x="640" y="272" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#141414" text-anchor="start">Strapped to the left side</text><text x="640" y="294" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#141414" text-anchor="start">of the backplate, where</text><text x="640" y="316" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#141414" text-anchor="start">your left hand finds it</text><line x1="636" y1="256" x2="376" y2="346" stroke="#5f5d55" stroke-width="1.5"/><circle cx="376" cy="346" r="3.5" fill="#5f5d55"/><text x="640" y="470" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#141414" text-anchor="start">Regulator</text><text x="640" y="492" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#141414" text-anchor="start">With an overpressure</text><text x="640" y="514" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#141414" text-anchor="start">relief valve</text><line x1="636" y1="476" x2="334" y2="510" stroke="#5f5d55" stroke-width="1.5"/><circle cx="334" cy="510" r="3.5" fill="#5f5d55"/></svg>