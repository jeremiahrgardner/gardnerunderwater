<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="Seen from above, a stage bottle is clipped closest to the body and a deco bottle outside it, both between the left chest and hip D-rings, with a further bottle on a short leash from the hip D-ring so its valve rests by the left thigh."><rect width="960" height="600" fill="#fffef9"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#141414"/></marker></defs><text x="40" y="46" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#5f5d55" text-anchor="start">LEFT-SIDE BOTTLES, SEEN FROM ABOVE</text><text x="40" y="68" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#5f5d55" text-anchor="start">Head to the left. The diver's left side is at the bottom.</text><rect x="560" y="166" width="320" height="40" rx="20" fill="#eeede6" stroke="#141414" stroke-width="2.5"/><rect x="560" y="220" width="320" height="40" rx="20" fill="#eeede6" stroke="#141414" stroke-width="2.5"/><rect x="150" y="140" width="440" height="140" rx="48" fill="#eeede6" stroke="#141414" stroke-width="2.5"/><circle cx="112" cy="210" r="34" fill="#eeede6" stroke="#141414" stroke-width="2.5"/><text x="250" y="266" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#5f5d55" text-anchor="middle">Chest D-ring</text><text x="470" y="266" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#5f5d55" text-anchor="middle">Hip D-ring</text><path d="M250,294 L240,318" fill="none" stroke="#141414" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M250,294 L262,392" fill="none" stroke="#141414" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M470,294 L470,312" fill="none" stroke="#141414" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M470,294 L462,384" fill="none" stroke="#141414" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M470,292 C500,296 540,304 588,318" fill="none" stroke="#E5B812" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="250" cy="286" r="11" fill="#fffef9" stroke="#141414" stroke-width="4"/><circle cx="470" cy="286" r="11" fill="#fffef9" stroke="#141414" stroke-width="4"/><rect x="236" y="306" width="264" height="52" rx="26.0" fill="#eeede6" stroke="#141414" stroke-width="2.5"/><rect x="210" y="323.0" width="28" height="18" fill="#b9b7ad" stroke="#141414" stroke-width="2"/><text x="368.0" y="338.0" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#141414" text-anchor="middle">Stage (inside)</text><rect x="256" y="380" width="224" height="46" rx="23.0" fill="#eeede6" stroke="#141414" stroke-width="2.5"/><rect x="230" y="394.0" width="28" height="18" fill="#b9b7ad" stroke="#141414" stroke-width="2"/><text x="368.0" y="409.0" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#141414" text-anchor="middle">Deco (outside)</text><rect x="600" y="296" width="260" height="46" rx="23.0" fill="#eeede6" stroke="#141414" stroke-width="2.5"/><rect x="574" y="310.0" width="28" height="18" fill="#b9b7ad" stroke="#141414" stroke-width="2"/><text x="730.0" y="325.0" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#141414" text-anchor="middle">Leashed bottle</text><text x="730" y="366" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#5f5d55" text-anchor="middle">Valve rests by the left thigh</text><text x="40" y="480" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#141414" text-anchor="start">Order on the hip D-ring</text><text x="40" y="502" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#141414" text-anchor="start">1. Stage or deco bottle  ·  2. Pressure gauge  ·  3. Leash</text><text x="40" y="540" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#141414" text-anchor="start">Two bottles slung, the rest on a leash</text><text x="40" y="562" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#141414" text-anchor="start">No more than three bottles on one leash</text><text x="600" y="480" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#141414" text-anchor="start">Why the left side</text><text x="600" y="502" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#141414" text-anchor="start">Keeps your right side clear</text><text x="600" y="524" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#141414" text-anchor="start">for the long hose</text></svg>