<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="A line marker pigtail: a short length of bungee attached to the chest D-ring, with cookies and arrows threaded on it and a knot at the free end to stop them sliding off."><rect width="960" height="600" fill="#fffef9"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#141414"/></marker></defs><text x="40" y="46" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#5f5d55" text-anchor="start">LINE MARKER PIGTAIL</text><text x="40" y="68" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#5f5d55" text-anchor="start">Markers threaded on bungee or tubing, stopped by a knot</text><path d="M200,200 L200,300 Q200,330 230,330 L250,330 Q280,330 280,300 L280,200 Z" fill="none" stroke="#141414" stroke-width="5"/><text x="240" y="180" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#141414" text-anchor="middle">Chest D-ring</text><path d="M280,300 C340,300 380,300 760,300" fill="none" stroke="#E5B812" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="772" cy="300" r="12" fill="#7a6100"/><circle cx="380" cy="300" r="22" fill="#141414"/><rect x="377" y="300" width="6" height="22" fill="#fffef9"/><circle cx="440" cy="300" r="22" fill="#141414"/><rect x="437" y="300" width="6" height="22" fill="#fffef9"/><circle cx="500" cy="300" r="22" fill="#141414"/><rect x="497" y="300" width="6" height="22" fill="#fffef9"/><path d="M550,284 L598,284 L618,300 L598,316 L550,316 Z" fill="#141414"/><path d="M630,284 L678,284 L698,300 L678,316 L630,316 Z" fill="#141414"/><text x="350" y="380" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#141414" text-anchor="start">Cookies</text><text x="350" y="402" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#141414" text-anchor="start">Non-directional</text><text x="560" y="380" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#141414" text-anchor="start">Arrows</text><text x="560" y="402" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#141414" text-anchor="start">Point the way out</text><text x="800" y="214" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#141414" text-anchor="start">Knot stop</text><text x="800" y="236" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#141414" text-anchor="start">Keeps markers on;</text><text x="800" y="258" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#141414" text-anchor="start">gives you a grip</text><line x1="794" y1="222" x2="776" y2="288" stroke="#5f5d55" stroke-width="1.5"/><circle cx="776" cy="288" r="3.5" fill="#5f5d55"/><text x="480" y="520" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#5f5d55" text-anchor="middle">Stretch the pigtail and its diameter shrinks, so a marker slides off with one hand.</text></svg>