<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="A single tank first stage seen from behind: the long hose leaves a right-side port; the necklace backup, wing inflator and pressure gauge leave the left side; a drysuit hose uses a spare low-pressure port."><rect width="960" height="600" fill="#fffef9"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#141414"/></marker></defs><text x="40" y="46" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#5f5d55" text-anchor="start">SINGLE TANK FIRST STAGE, SEEN FROM BEHIND</text><text x="40" y="68" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#5f5d55" text-anchor="start">Diver's left is on the left. Port layout varies by first stage.</text><path d="M400,330.0 A80.0,80.0 0 0 1 560,330.0 L560,568 Q560,580 548,580 L412,580 Q400,580 400,568 Z" fill="#eeede6" stroke="#141414" stroke-width="2.5"/><rect x="466" y="200" width="28" height="56" fill="#b9b7ad" stroke="#141414" stroke-width="2"/><rect x="452" y="182" width="56" height="18" rx="6" fill="#141414"/><rect x="420" y="214" width="120" height="44" rx="12" fill="#b9b7ad" stroke="#141414" stroke-width="2.5"/><circle cx="420" cy="226" r="5" fill="#141414"/><circle cx="420" cy="246" r="5" fill="#141414"/><circle cx="540" cy="226" r="5" fill="#141414"/><circle cx="540" cy="246" r="5" fill="#141414"/><rect x="452" y="258" width="18" height="10" fill="#141414"/><path d="M540,226 C640,226 740,250 760,320 L760,560" fill="none" stroke="#E5B812" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M420,226 C360,214 330,170 320,120" fill="none" stroke="#141414" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M420,246 C350,250 300,236 262,210" fill="none" stroke="#141414" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M461,268 C440,330 330,360 300,420 L300,540" fill="none" stroke="#141414" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M540,246 C600,270 610,330 600,380" fill="none" stroke="#141414" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10 7"/><text x="784" y="340" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#141414" text-anchor="start">Long hose</text><text x="784" y="362" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#141414" text-anchor="start">Right-side port,</text><text x="784" y="384" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#141414" text-anchor="start">straight down</text><text x="784" y="406" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#141414" text-anchor="start">your right side</text><text x="40" y="116" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#141414" text-anchor="start">Necklace backup</text><text x="40" y="138" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#141414" text-anchor="start">Left-side port, over the</text><text x="40" y="160" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#141414" text-anchor="start">left shoulder</text><line x1="222" y1="122" x2="318" y2="124" stroke="#5f5d55" stroke-width="1.5"/><circle cx="318" cy="124" r="3.5" fill="#5f5d55"/><text x="40" y="200" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#141414" text-anchor="start">Wing inflator</text><text x="40" y="222" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#141414" text-anchor="start">Left-side port, to your</text><text x="40" y="244" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#141414" text-anchor="start">left-shoulder inflator</text><line x1="236" y1="206" x2="262" y2="210" stroke="#5f5d55" stroke-width="1.5"/><circle cx="262" cy="210" r="3.5" fill="#5f5d55"/><text x="40" y="430" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#141414" text-anchor="start">Pressure gauge</text><text x="40" y="452" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#141414" text-anchor="start">High-pressure port, down</text><text x="40" y="474" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#141414" text-anchor="start">the left side to the hip</text><line x1="250" y1="436" x2="300" y2="450" stroke="#5f5d55" stroke-width="1.5"/><circle cx="300" cy="450" r="3.5" fill="#5f5d55"/><text x="596" y="440" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#141414" text-anchor="start">Drysuit inflator</text><text x="596" y="462" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#141414" text-anchor="start">Spare low-pressure</text><text x="596" y="484" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#141414" text-anchor="start">port. Side depends</text><text x="596" y="506" font-family="DM Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#141414" text-anchor="start">on your first stage</text><line x1="604" y1="424" x2="602" y2="386" stroke="#5f5d55" stroke-width="1.5"/><circle cx="602" cy="386" r="3.5" fill="#5f5d55"/></svg>